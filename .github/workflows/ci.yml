name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Write key
      run: |
        if [ ! -z "${{ secrets.MIPUSH_SIGNING_KEY }}" ]; then
          echo HAS_SIGNING_KEY=true >> $GITHUB_ENV
          echo STORE_PASSWORD='${{ secrets.MIPUSH_KEYSTORE_PASSWORD }}' >> local.properties
          echo KEY_ALIAS='${{ secrets.MIPUSH_KEY_ALIAS }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.MIPUSH_KEY_PASSWORD }}' >> local.properties
          echo STORE_FILE_PATH='../release.keystore' >> local.properties
          echo ${{ secrets.MIPUSH_SIGNING_KEY }} | base64 --decode > release.keystore
        else
          echo HAS_SIGNING_KEY=false >> $GITHUB_ENV
        fi

    - name: Git describe
      id: ghd
      shell: bash
      run: |
        # A fork may not have the upstream tags expected by gh-describe.
        # Keep the build self-contained and always provide the outputs used by
        # the Gradle and release steps.
        describe="$(git describe --tags --dirty --exclude='v*-*' 2>/dev/null || git rev-parse --short HEAD)"
        sha="$(git rev-parse HEAD)"
        echo "describe=$describe" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew --build-cache --no-daemon --max-workers=1 -P versionName=${{ steps.ghd.outputs.describe }} assemble

    - name: Collect artifcat name
      run: |
        echo "debug_artifact=$(basename -s .apk app/build/outputs/apk/debug/*.apk)" >> $GITHUB_ENV
        echo "release_artifact=$(basename -s .apk app/build/outputs/apk/release/*.apk)" >> $GITHUB_ENV

    - name: Upload Debug
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ env.debug_artifact }}
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release
      if: env.HAS_SIGNING_KEY == 'true'
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ env.release_artifact }}
        path: app/build/outputs/apk/release/*.apk

    - name: Get Version Name
      if: env.HAS_SIGNING_KEY == 'true'
      id: gvn
      run: |
        artifact_name=(app/build/outputs/apk/release/*.apk)
        version=$(echo $artifact_name | sed 's/.*(v.*)(-[^-]+){2}/\1/' -r)
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Release
      if: >-
        env.HAS_SIGNING_KEY == 'true' &&
        env.release_artifact != '' &&
        steps.gvn.outputs.version != ''
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ steps.gvn.outputs.version }}
        tag_name: ${{ steps.gvn.outputs.version }}
        target_commitish: ${{ steps.ghd.outputs.sha }}
        prerelease: true
        files: app/build/outputs/apk/*/*.apk
